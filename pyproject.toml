[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-wyoming-proxy"
dynamic = ["version"]
description = "OpenAI-compatible audio API (/v1/audio/transcriptions, /v1/audio/speech) in front of Wyoming STT/TTS servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18",
    "wyoming>=1.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
openai-wyoming-proxy = "openai_wyoming_proxy.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "openai_wyoming_proxy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
